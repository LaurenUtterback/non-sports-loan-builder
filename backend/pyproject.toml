[project]
name = "non-sports-loan-builder-backend"
version = "1.0.0"
description = "Backend API for South River Capital non-sports loan credit memos"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    # PDF rendering uses Playwright's headless Chromium, whose print engine
    # honors the memo template's @page / @media print CSS and needs no system
    # GTK/Pango/Cairo libraries (WeasyPrint couldn't load those on Windows).
    # PINNED. The machine's browser cache holds chromium-1223, which belongs to
    # the 1.60.x line; a newer playwright looks for a build that isn't there and
    # every PDF/binder render fails with "Executable doesn't exist". Only bump
    # this together with `python -m playwright install chromium` run from a
    # PLAIN terminal or a scheduled task -- never from inside the Claude app,
    # whose MSIX container virtualizes the download into a private overlay.
    "playwright==1.60.0",
    # Participation Agreement Builder: fill the .docx template (docxtpl/python-docx).
    # PDF export of the agreement uses LibreOffice headless (located at runtime),
    # not a Python dependency.
    "python-docx>=1.1",
    "docxtpl>=0.18",
    # Reads the Participant Breakdown .xlsx (participation %, points, late-fee share).
    "openpyxl>=3.1",
    # Closing Binder: merges the executed PDFs behind the rendered cover/index
    # and writes the outline bookmarks.
    "pypdf>=4.0",
    # Oversized uploads are shrunk rather than refused: pypdf's image
    # recompression (doc_blocks._recompress_pdf) decodes and re-encodes through
    # Pillow, so it is a runtime dependency, not just a test one.
    "pillow>=10.0",
    # Demand Signatures client (also pulled in transitively by anthropic).
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",        # for FastAPI TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
